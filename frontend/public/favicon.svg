<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#080B10" />
    </radialGradient>
    <linearGradient id="topFacet" x1="50" y1="8" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="leftFacet" x1="14" y1="50" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="rightFacet" x1="86" y1="50" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="28" fill="url(#bg)" stroke="#6366F1" stroke-width="2" stroke-opacity="0.4" />

  <!-- Orbit Rings -->
  <ellipse cx="50" cy="50" rx="38" ry="18" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.6" transform="rotate(-25 50 50)" />
  <circle cx="20" cy="38" r="3" fill="#38BDF8" filter="url(#neonGlow)" />

  <!-- Prism Facets -->
  <polygon points="50,14 82,34 50,54 18,34" fill="url(#topFacet)" />
  <polygon points="18,34 50,54 50,86 18,66" fill="url(#leftFacet)" />
  <polygon points="50,54 82,34 82,66 50,86" fill="url(#rightFacet)" />

  <!-- Edges -->
  <line x1="50" y1="14" x2="50" y2="86" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="50" y1="54" x2="18" y2="34" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5" />
  <line x1="50" y1="54" x2="82" y2="34" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Quantum Core Spark -->
  <circle cx="50" cy="54" r="4.5" fill="#38BDF8" filter="url(#neonGlow)" />
  <circle cx="50" cy="54" r="2" fill="#FFFFFF" />
</svg>
